[package]
name = "raphael-desktop"
version = "0.3.0"
edition = "2021"
description = "Raphael Control Center for Windows, Linux and macOS (Tauri): the Raphael Web UI in a desktop window with a tray icon and notifications"
license = "MIT"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
raphael-web = { path = "../../web/rust" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
